name: Website Docs

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  docs:
    name: Build and validate docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate agent-serving templates
        run: ruby scripts/check-agent-serving-templates.rb

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Check local docs links
        run: ruby scripts/check-docs-links.rb
